<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ukeplan</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ukeplan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="themeColor" content="#F2E7D5">
<style>
  :root{
    --bg:#F2E7D5; --paper:#FAF7F0; --ink:#6E4332; --muted:#9A7770; --line:#F1CBBF;
    --pink:#B48C86; --babypink:#F1CBBF; --lilac:#D8B0AB; --mint:#E9C8B6;
    --input:#FFFFFF; --jobb:#7C4E39; --skole:#B48C86; --trening:#BB8768; --annet:#D8B0AB;
  }
  body.uk-dark{
    --bg:#241917; --paper:#33241F; --ink:#F1CBBF; --muted:#B4928A; --line:#4A352F; --input:#2B1E1A;
    --pink:#D8B0AB; --babypink:#5B3F38; --lilac:#4E3732; --mint:#5A4034;
    --jobb:#F1CBBF; --skole:#B48C86; --trening:#CB9472; --annet:#8C6A64;
    color-scheme:dark;
  }
  body.uk-dark .cats button[aria-pressed="true"]{color:var(--bg)}
  body.uk-dark .cats button[data-cat="annet"][aria-pressed="true"]{color:var(--ink)}
  body.uk-dark .pill span{opacity:.7}
  body{transition:background-color .25s,color .25s}
  .tools .theme{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.85rem;text-decoration:none}
  @media (prefers-reduced-motion:reduce){body{transition:none}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",system-ui,sans-serif;line-height:1.45;min-height:100vh;padding:max(20px, calc(env(safe-area-inset-top) + 12px)) 16px max(48px, calc(env(safe-area-inset-bottom) + 24px))}
  main{max-width:560px;margin:0 auto}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nav{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--pink);font-size:1.2rem}
  .title{text-align:center}
  h1{font-size:1.7rem;letter-spacing:-.01em;color:var(--ink)}
  h1::after{content:' ♡';font-size:1.1rem;vertical-align:.15em;color:var(--pink)}
  .range{color:var(--muted);font-size:.92rem}
  .today-btn{display:block;margin:6px auto 0;border:none;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline}

  .summary{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
  .pill{flex:1;min-width:110px;background:var(--paper);border-radius:12px;padding:10px 12px}
  .pill{border-radius:18px}
  .pill:nth-child(1){background:var(--mint)}
  .pill:nth-child(2){background:var(--lilac)}
  .pill:nth-child(3){background:var(--babypink)}
  .pill span{color:var(--ink)!important;opacity:.75}
  .pill b{display:block;font-size:1.4rem;line-height:1.1}
  .pill span{font-size:.85rem;color:var(--muted)}
  .tools{display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px}
  .tools button{border:none;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline}

  .day{background:var(--paper);border-radius:24px;box-shadow:0 2px 0 var(--line);padding:16px;margin-bottom:12px;border:2px solid transparent}
  .day.is-today{border-color:var(--pink);border-style:dashed}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .day-head h2{font-size:1.15rem}
  .day-head small{color:var(--muted)}
  ul{list-style:none}
  li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .item{flex:1;min-width:0}
  .item .t{font-size:.82rem;color:var(--muted)}
  .item.done .txt{text-decoration:line-through;color:var(--muted)}
  .check,.del{border:none;background:none;width:32px;height:32px;border-radius:8px;flex:none}
  .check{border:1.5px solid var(--line);font-size:.95rem;border-radius:50%;color:var(--pink)}
  .check.on{background:var(--babypink);border-color:var(--pink);color:var(--pink)}
  .del{color:var(--muted);font-size:1.1rem}
  .dup{border:none;background:none;width:32px;height:32px;border-radius:8px;flex:none;color:var(--muted);font-size:1rem}
  li.copyrow{flex-wrap:wrap;gap:6px;border-top:none;padding:0 0 10px 20px}
  .copyrow small{width:100%;color:var(--muted);font-size:.82rem}
  .dchip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:.85rem}
  .dchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .docopy{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font-size:.85rem}
  .cancelcopy{border:none;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline}
  .cats button[data-cat="annet"][aria-pressed="true"]{color:var(--ink)}
  .check.on{color:var(--ink)}
  .right{display:flex;gap:14px}
  .sheet{position:fixed;inset:0;background:rgba(36,25,23,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
  .sheet[hidden]{display:none}
  .sheet-box{background:var(--paper);border-radius:24px;padding:18px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
  .sheet-box h2{font-size:1.15rem}
  .sheet-box p{font-size:.88rem;color:var(--muted)}
  .sheet-box textarea{width:100%;height:240px;border:1.5px solid var(--line);border-radius:14px;background:var(--input);color:var(--ink);padding:10px;font:inherit;font-size:.9rem;resize:none}
  .sheet-box .go{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px;font-size:.95rem}
  .tabs{display:flex;align-items:center;gap:6px;margin-bottom:18px}
  .tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:.92rem;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .tabs .theme{margin-left:auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.85rem}
  button.item{background:none;border:none;padding:0;text-align:left;cursor:pointer}
  li.editrow{display:block;padding:10px 0}
  li.editrow .add{margin-top:0}
  .edays{display:flex;flex-wrap:wrap;gap:4px;width:100%;align-items:center}
  .edays small{color:var(--muted);font-size:.82rem;margin-right:4px}
  .eactions{display:flex;gap:10px;align-items:center;width:100%}
  .shop h2{font-size:1.25rem;margin-bottom:6px}
  .shop .add{margin:0 0 6px}
  .shop-tools{display:flex;justify-content:space-between;margin-top:10px}
  .shop-tools button{border:none;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline}
  .empty{color:var(--muted);font-size:.9rem;padding:4px 0}

  .add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .cats{display:flex;gap:4px;width:100%}
  .cats button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 2px;font-size:.82rem}
  .cats button[aria-pressed="true"]{color:#fff;border-color:transparent}
  .add input{border:1.5px solid var(--line);background:var(--input);border-radius:999px;padding:8px 10px;font-size:.95rem}
  .add .time{width:96px}
  .add .what{flex:1;min-width:120px}
  .add .go{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 14px}

  .note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabWeek" aria-selected="true">Ukeplan</button>
    <button class="tab" role="tab" id="tabShop" aria-selected="false">Handleliste</button>
    <button class="theme" id="theme"></button>
  </div>
  <div id="weekView">
  <div class="top">
    <button class="nav" id="prev" aria-label="Forrige uke">‹</button>
    <div class="title">
      <h1 id="week"></h1>
      <div class="range" id="range"></div>
    </div>
    <button class="nav" id="next" aria-label="Neste uke">›</button>
  </div>
  <button class="today-btn" id="toThis" hidden>Gå til denne uka</button>

  <div class="summary" id="summary"></div>
  <div class="tools"><span class="right"><button id="share">Del uka</button><button id="copy">Kopier forrige uke</button></span></div>
  <div class="sheet" id="sheet" hidden><div class="sheet-box"><h2>Del uka</h2><p>Teksten er markert. Kopier den og lim inn i en melding.</p><textarea id="shareText" readonly></textarea><button class="go" id="closeSheet">Lukk</button></div></div>

  <div id="days"></div>
  </div>
  <div id="shopView" hidden>
    <section class="day shop">
      <h2>Handleliste</h2>
      <div class="add">
        <input class="what" id="shopInput" placeholder="Hva må du kjøpe?">
        <button class="go" id="shopAdd">Legg til</button>
      </div>
      <ul id="shopList"></ul>
      <div class="shop-tools"><button id="shopShare">Del listen</button><button id="shopClear">Fjern det som er kjøpt</button></div>
    </section>
  </div>
  <p class="note" id="status"></p>
</main>

<script>
const CATS = {
  jobb:{label:'Jobb',color:'var(--jobb)'},
  skole:{label:'Skole',color:'var(--skole)'},
  trening:{label:'Trening',color:'var(--trening)'},
  annet:{label:'Annet',color:'var(--annet)'}
};
const DAYS = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
const SHORT = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
const MONTHS = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];

let monday = startOfWeek(new Date());
let plan = emptyPlan();
let chosen = {}; // valgt kategori per dag
let copying = null; // {d, j, targets}
let editing = null; // {d, j, cat, day}
let shop = [];
let memory = {}; // fallback hvis lagring ikke finnes

function startOfWeek(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wd = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - wd);
  return x;
}
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function key(d){ return 'ukeplan:' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function emptyPlan(){ return {days:[[],[],[],[],[],[],[]]}; }
function normalize(p){ while(p.days.length<7) p.days.push([]); return p; }
function fmt(d){ return d.getDate() + '. ' + MONTHS[d.getMonth()]; }

// Lagring: Claude-appen, ellers nettleserens lokale lagring, ellers bare i minnet
let local = null;
try{ const t='__test'; window.localStorage.setItem(t,t); window.localStorage.removeItem(t); local = window.localStorage; }catch(e){}

async function load(d){
  const k = key(d);
  try{
    if(window.storage){
      const r = await window.storage.get(k, false);
      if(r && r.value) return normalize(JSON.parse(r.value));
    } else if(local){
      const v = local.getItem(k);
      if(v) return normalize(JSON.parse(v));
    } else if(memory[k]) return normalize(JSON.parse(memory[k]));
  }catch(e){}
  return emptyPlan();
}
async function save(){
  const k = key(monday), v = JSON.stringify(plan);
  try{
    if(window.storage){
      const r = await window.storage.set(k, v, false);
      setStatus(r ? '' : 'Kunne ikke lagre.');
    } else if(local){
      local.setItem(k, v); setStatus('');
    } else { memory[k] = v; setStatus('Endringer lagres bare så lenge siden er åpen.'); }
  }catch(e){ setStatus('Kunne ikke lagre.'); }
}
function setStatus(t){ document.getElementById('status').textContent = t; }

function sortItems(arr){
  arr.sort((a,b)=> (a.time||'99').localeCompare(b.time||'99'));
}

function render(){
  const fri = addDays(monday,6);
  document.getElementById('week').textContent = 'Uke ' + isoWeek(monday);
  document.getElementById('range').textContent = fmt(monday) + ' – ' + fmt(fri);
  const thisMon = startOfWeek(new Date());
  document.getElementById('toThis').hidden = monday.getTime() === thisMon.getTime();

  const all = plan.days.flat();
  const tr = all.filter(i=>i.cat==='trening');
  const trDone = tr.filter(i=>i.done).length;
  const jobbDays = plan.days.filter(d=>d.some(i=>i.cat==='jobb')).length;
  const skole = all.filter(i=>i.cat==='skole').length;
  document.getElementById('summary').innerHTML =
    `<div class="pill"><b>${trDone}/${tr.length}</b><span>økter gjennomført</span></div>
     <div class="pill"><b>${jobbDays}</b><span>jobbdager</span></div>
     <div class="pill"><b>${skole}</b><span>skoleting</span></div>`;

  const today = new Date(); today.setHours(0,0,0,0);
  const wrap = document.getElementById('days');
  wrap.innerHTML = '';
  DAYS.forEach((name,i)=>{
    const date = addDays(monday,i);
    const cat = chosen[i] || 'trening';
    const sec = document.createElement('section');
    sec.className = 'day' + (date.getTime()===today.getTime() ? ' is-today' : '');
    const items = plan.days[i];
    sec.innerHTML = `
      <div class="day-head"><h2>${name}</h2><small>${fmt(date)}</small></div>
      ${items.length ? '<ul>' + items.map((it,j)=>`
        ${editing && editing.d===i && editing.j===j ? editRow(it) : `<li>
          <span class="dot" style="background:${CATS[it.cat].color}"></span>
          <button class="item ${it.done?'done':''}" data-edit="1" data-d="${i}" data-j="${j}" aria-label="Rediger">
            <div class="txt">${esc(it.text)}</div>
            ${it.time ? `<div class="t">${esc(it.time)}</div>` : ''}
          </button>
          <button class="check ${it.done?'on':''}" data-d="${i}" data-j="${j}" aria-label="Marker som gjort">${it.done?'♥':''}</button>
          <button class="dup" data-d="${i}" data-j="${j}" aria-label="Kopier til andre dager">⧉</button>
          <button class="del" data-d="${i}" data-j="${j}" aria-label="Slett">×</button>
        </li>`}${copying && copying.d===i && copying.j===j ? copyRow(i) : ''}`).join('') + '</ul>' : '<p class="empty">Ingenting planlagt ennå ✿</p>'}
      <div class="add">
        <div class="cats">${Object.entries(CATS).map(([k,c])=>`
          <button data-d="${i}" data-cat="${k}" aria-pressed="${k===cat}" style="${k===cat?'background:'+c.color:''}">${c.label}</button>`).join('')}
        </div>
        <input class="time" id="time${i}" placeholder="07:15">
        <input class="what" id="what${i}" placeholder="Hva skal du gjøre?">
        <button class="go" data-add="${i}">Legg til</button>
      </div>`;
    wrap.appendChild(sec);
  });
}
function editRow(it){
  return `<li class="editrow"><div class="add">
    <div class="cats">${Object.entries(CATS).map(([k,c])=>`
      <button data-ecat="${k}" aria-pressed="${k===editing.cat}" style="${k===editing.cat?'background:'+c.color:''}">${c.label}</button>`).join('')}
    </div>
    <input class="time" id="etime" value="${esc(editing.time ?? it.time ?? '')}" placeholder="07:15">
    <input class="what" id="etext" value="${esc(editing.text ?? it.text)}">
    <div class="edays"><small>Dag:</small>${SHORT.map((n,k)=>`<button class="dchip" data-eday="${k}" aria-pressed="${k===editing.day}">${n}</button>`).join('')}</div>
    <div class="eactions"><button class="go" id="esave">Lagre</button><button class="cancelcopy" id="ecancel">Avbryt</button></div>
  </div></li>`;
}
function copyRow(i){
  const others = DAYS.map((_,k)=>k).filter(k=>k!==i);
  const allOn = others.every(k=>copying.targets.includes(k));
  return `<li class="copyrow"><small>Kopier til:</small>
    ${others.map(k=>`<button class="dchip" data-copyday="${k}" aria-pressed="${copying.targets.includes(k)}">${SHORT[k]}</button>`).join('')}
    <button class="dchip" data-copyall="1" aria-pressed="${allOn}">Alle</button>
    <button class="docopy">Kopier</button>
    <button class="cancelcopy">Avbryt</button></li>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function addItem(i){
  const w = document.getElementById('what'+i), t = document.getElementById('time'+i);
  const text = w.value.trim();
  if(!text){ w.focus(); return; }
  copying = null; editing = null;
  plan.days[i].push({cat:chosen[i]||'trening', time:t.value.trim(), text, done:false});
  sortItems(plan.days[i]);
  render(); await save();
}

document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.edit){
    const d=+b.dataset.d, j=+b.dataset.j, it=plan.days[d][j];
    copying = null; editing = {d, j, cat:it.cat, day:d};
    render(); document.getElementById('etext').focus(); return;
  }
  if(b.dataset.ecat){ keepEditInputs(); editing.cat = b.dataset.ecat; render(); return; }
  if(b.dataset.eday !== undefined){ keepEditInputs(); editing.day = +b.dataset.eday; render(); return; }
  if(b.id==='ecancel'){ editing = null; render(); return; }
  if(b.id==='esave'){ await saveEdit(); return; }
  if(b.dataset.cat){ chosen[b.dataset.d] = b.dataset.cat; render(); document.getElementById('what'+b.dataset.d).focus(); return; }
  if(b.dataset.add !== undefined){ addItem(+b.dataset.add); return; }
  if(b.classList.contains('check')){ const it = plan.days[b.dataset.d][b.dataset.j]; it.done = !it.done; render(); await save(); return; }
  if(b.classList.contains('del')){ copying = null; editing = null; plan.days[b.dataset.d].splice(b.dataset.j,1); render(); await save(); return; }
  if(b.classList.contains('dup')){
    const d=+b.dataset.d, j=+b.dataset.j;
    editing = null;
    copying = (copying && copying.d===d && copying.j===j) ? null : {d, j, targets:[]};
    render(); return;
  }
  if(b.dataset.copyday !== undefined){
    const k=+b.dataset.copyday, t=copying.targets;
    copying.targets = t.includes(k) ? t.filter(x=>x!==k) : [...t,k];
    render(); return;
  }
  if(b.dataset.copyall){
    const others = DAYS.map((_,k)=>k).filter(k=>k!==copying.d);
    copying.targets = others.every(k=>copying.targets.includes(k)) ? [] : others;
    render(); return;
  }
  if(b.classList.contains('cancelcopy')){ copying = null; render(); return; }
  if(b.classList.contains('docopy')){
    if(!copying.targets.length) return;
    const src = plan.days[copying.d][copying.j];
    copying.targets.forEach(k=>{ plan.days[k].push({...src, done:false}); sortItems(plan.days[k]); });
    copying = null; render(); await save(); return;
  }
});
function keepEditInputs(){
  editing.time = document.getElementById('etime').value;
  editing.text = document.getElementById('etext').value;
}
async function saveEdit(){
  const text = document.getElementById('etext').value.trim();
  if(!text){ document.getElementById('etext').focus(); return; }
  const it = plan.days[editing.d].splice(editing.j,1)[0];
  Object.assign(it, {text, time:document.getElementById('etime').value.trim(), cat:editing.cat});
  plan.days[editing.day].push(it); sortItems(plan.days[editing.day]);
  editing = null; render(); await save();
}
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.id==='etext' || e.target.id==='etime')){ saveEdit(); return; }
  if(e.key==='Enter' && e.target.id==='shopInput'){ addShop(); return; }
  if(e.key==='Enter' && e.target.matches('.add input')){
    const id = e.target.id.replace(/\D/g,''); addItem(+id);
  }
});
async function go(d){ monday = d; chosen = {}; copying = null; editing = null; plan = await load(monday); render(); }
document.getElementById('prev').onclick = ()=>go(addDays(monday,-7));
document.getElementById('next').onclick = ()=>go(addDays(monday,7));
document.getElementById('toThis').onclick = ()=>go(startOfWeek(new Date()));
document.getElementById('copy').onclick = async ()=>{
  const prev = await load(addDays(monday,-7));
  if(!prev.days.flat().length){ setStatus('Forrige uke er tom, ingenting å kopiere.'); return; }
  if(plan.days.flat().length && !confirm('Dette erstatter planen for denne uka. Fortsette?')) return;
  plan = {days: prev.days.map(d=>d.map(i=>({...i, done:false})))};
  render(); await save();
};

// Generell lagring
async function getVal(k){
  try{
    if(window.storage){ const r = await window.storage.get(k,false); return r ? r.value : null; }
    if(local) return local.getItem(k);
    return memory[k] ?? null;
  }catch(e){ return null; }
}
async function setVal(k,v){
  try{
    if(window.storage) await window.storage.set(k,v,false);
    else if(local) local.setItem(k,v);
    else memory[k]=v;
  }catch(e){ setStatus('Kunne ikke lagre.'); }
}

// Handleliste
const SHOP_KEY = 'ukeplan-handleliste';
function renderShop(){
  const ul = document.getElementById('shopList');
  ul.innerHTML = shop.length ? shop.map((it,j)=>`
    <li>
      <div class="item ${it.done?'done':''}"><div class="txt">${esc(it.text)}</div></div>
      <button class="check ${it.done?'on':''}" data-shop="${j}" aria-label="Kjøpt">${it.done?'♥':''}</button>
      <button class="del" data-shopdel="${j}" aria-label="Slett">×</button>
    </li>`).join('') : '<li class="empty">Handlelisten er tom ✿</li>';
}
async function saveShop(){ await setVal(SHOP_KEY, JSON.stringify(shop)); }
async function addShop(){
  const inp = document.getElementById('shopInput'), text = inp.value.trim();
  if(!text){ inp.focus(); return; }
  shop.push({text, done:false}); inp.value=''; renderShop(); inp.focus(); await saveShop();
}
document.getElementById('shopAdd').onclick = addShop;
document.getElementById('shopList').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  e.stopPropagation();
  if(b.dataset.shop!==undefined){ const it=shop[+b.dataset.shop]; it.done=!it.done; }
  else if(b.dataset.shopdel!==undefined){ shop.splice(+b.dataset.shopdel,1); }
  renderShop(); await saveShop();
});
document.getElementById('shopClear').onclick = async ()=>{ shop = shop.filter(i=>!i.done); renderShop(); await saveShop(); };
document.getElementById('shopShare').onclick = ()=>{
  const left = shop.filter(i=>!i.done);
  shareText('Handleliste', ['Handleliste',''].concat(left.length ? left.map(i=>'• '+i.text) : ['Ingenting å kjøpe!']).join('\n'));
};
(async()=>{ try{ shop = JSON.parse(await getVal(SHOP_KEY) || '[]'); }catch(e){ shop=[]; } renderShop(); })();

// Faner
function showTab(t){
  document.getElementById('tabWeek').setAttribute('aria-selected', t==='week');
  document.getElementById('tabShop').setAttribute('aria-selected', t==='shop');
  document.getElementById('weekView').hidden = t!=='week';
  document.getElementById('shopView').hidden = t!=='shop';
}
document.getElementById('tabWeek').onclick = ()=>showTab('week');
document.getElementById('tabShop').onclick = ()=>showTab('shop');

// Deling
async function shareText(title, text){
  if(navigator.share){
    try{ await navigator.share({title, text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const ta = document.getElementById('shareText');
  document.querySelector('.sheet-box h2').textContent = title;
  ta.value = text;
  document.getElementById('sheet').hidden = false;
  ta.focus(); ta.select();
  try{ await navigator.clipboard.writeText(text); document.querySelector('.sheet-box p').textContent = 'Kopiert! Lim den inn i en melding.'; }catch(e){}
}

// Del uka
function weekText(){
  const lines = ['Uke ' + isoWeek(monday) + ' (' + fmt(monday) + ' – ' + fmt(addDays(monday,6)) + ')'];
  plan.days.forEach((items,i)=>{
    if(!items.length) return;
    lines.push('', DAYS[i] + ' ' + fmt(addDays(monday,i)));
    items.forEach(it=>lines.push('• ' + (it.time ? it.time + ' ' : '') + it.text + ' (' + CATS[it.cat].label.toLowerCase() + ')'));
  });
  if(lines.length===1) lines.push('', 'Ingenting planlagt denne uka.');
  return lines.join('\n');
}
document.getElementById('share').onclick = ()=>shareText('Uke ' + isoWeek(monday), weekText());
document.getElementById('closeSheet').onclick = ()=>{ document.getElementById('sheet').hidden = true; document.querySelector('.sheet-box p').textContent = 'Teksten er markert. Kopier den og lim inn i en melding.'; };
document.getElementById('sheet').onclick = e=>{ if(e.target.id==='sheet') document.getElementById('closeSheet').click(); };

// Lys/mørk modus
const THEME_KEY = 'ukeplan-tema';
let currentTheme = 'light';
function applyTheme(t){
  currentTheme = t;
  document.body.classList.toggle('uk-dark', t==='dark');
  document.documentElement.style.background = t==='dark' ? '#241917' : '#F2E7D5';
  document.documentElement.style.colorScheme = t==='dark' ? 'dark' : 'light';
  document.getElementById('themeColor').setAttribute('content', t==='dark' ? '#241917' : '#F2E7D5');
  document.getElementById('theme').textContent = t==='dark' ? '☀︎ Lys modus' : '☾ Mørk modus';
}
async function loadTheme(){
  let t = null;
  try{
    if(window.storage){ const r = await window.storage.get(THEME_KEY,false); if(r) t = r.value; }
    else if(local) t = local.getItem(THEME_KEY);
  }catch(e){}
  if(!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(t);
}
document.getElementById('theme').onclick = async ()=>{
  const t = currentTheme==='dark' ? 'light' : 'dark';
  applyTheme(t);
  try{
    if(window.storage) await window.storage.set(THEME_KEY,t,false);
    else if(local) local.setItem(THEME_KEY,t);
  }catch(e){}
};
applyTheme('light');
loadTheme();

go(monday);
</script>
